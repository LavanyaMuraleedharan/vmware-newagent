vmware-agent:
  codeConfiguration:
    dependencyResolution: remote_build
    entryPoint: main.py
    runtime: python_3_13

  container:
    resources:
      cpu: "0.5"
      memory: 1Gi

  env:
    AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    PYTHONNOUSERSITE: "1"
    MCP_SERVER_URL: ${MCP_SERVER_URL}
    MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}

  host: azure.ai.agent
  kind: hosted
  language: python
  name: vmware-agent
  project: .

  protocols:
    - protocol: responses
      version: 2.0.0

  uses:
    - lavamdn04-2479
